<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS - Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
 <div class="text-center mt-6 mb-6">

    <img src="images/logo.jpeg"
         alt="EMS Logo"
         class="w-20 h-20 mx-auto rounded-full shadow-lg">

    <h1 class="text-4xl font-bold text-indigo-700 mt-3">
        Employee Management System
    </h1>

</div>
<div class="flex min-h-screen">
    <!-- Sidebar same as others -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900">
      <div class="p-4 border-b border-slate-700">
        <h2 class="text-xl font-bold text-white">EMS</h2>
        <p class="text-slate-400 text-xs">Employee System</p>
      </div>
      <nav class="p-2 space-y-1">
        <a href="dashboard.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">📊 Dashboard</a>
        <a href="notification.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm bg-indigo-600 text-white">🔔 Notification</a>
        <a href="attendance.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">⏰ Attendance</a>
      </nav>
    </div>

    <div class="flex-1 lg:ml-64">
      <div class="topbar px-4 sm:px-8 py-4 bg-white shadow-sm">
        <h2 class="text-xl sm:text-2xl font-bold text-slate-800">🔔 Notifications</h2>
      </div>

      <div class="p-4 sm:p-8">
        <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
          <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">All Notifications</h1>
            <button onclick="loadNotifications()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">Refresh</button>
          </div>

          <ul id="notificationList" class="space-y-4">
            <li class="text-center text-gray-400 p-4">Loading...</li>
          </ul>

        </div>
      </div>
    </div>
</div>

<script>
const API_URL = "http://localhost:5000/api";

async function loadNotifications() {
    const list = document.getElementById("notificationList");
    list.innerHTML = `<li class="text-center text-gray-400 p-4">Loading...</li>`;

    try {
        const res = await fetch(`${API_URL}/notifications`);
        const result = await res.json();
        console.log("API Response:", result); // debug ku

        list.innerHTML = "";

        if(result.success && result.data && result.data.length > 0){
            result.data.forEach(noti => {
                let color = 'bg-indigo-100 text-indigo-800';
                let icon = '✔';
                if(noti.type === 'leave') {color = 'bg-green-100 text-green-800'; icon = '📅'}
                if(noti.type === 'salary') {color = 'bg-yellow-100 text-yellow-800'; icon = '💰'}
                if(noti.type === 'meeting') {color = 'bg-red-100 text-red-800'; icon = '📢'}
                if(noti.type === 'attendance') {color = 'bg-blue-100 text-blue-800'; icon = '⏰'}

                let time = noti.created_at ? new Date(noti.created_at).toLocaleString('en-IN') : '';

                list.innerHTML += `
                <li class="${color} p-4 rounded-xl flex items-start gap-3">
                    <span class="text-xl">${icon}</span>
                    <div class="flex-1">
                        <p class="font-semibold">${noti.message}</p>
                        <p class="text-xs opacity-70 mt-1">${time}</p>
                    </div>
                </li>
                `;
            });
        } else {
            list.innerHTML = `<li class="text-center text-gray-500 p-4">No new notifications</li>`;
        }

    } catch(err){
        console.log("Notification Load Error:", err);
        document.getElementById("notificationList").innerHTML = `<li class="text-center text-red-500 p-4">Failed to load. Backend running ah?</li>`;
    }
}

window.onload = loadNotifications;
</script>
</body>
</html>
