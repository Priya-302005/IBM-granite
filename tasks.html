<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
 <div class="text-center mt-6 mb-6">

    <img src="images/logo.jpeg"
         alt="EMS Logo"
         class="w-20 h-20 mx-auto rounded-full shadow-lg">

    <h1 class="text-4xl font-bold text-indigo-700 mt-3">
        Employee Management System
    </h1>

</div>
<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-xl shadow">

    <h1 class="text-3xl font-bold text-indigo-700 mb-6">
        🔑 Password Generator
    </h1>

    <!-- Employee ID -->
    <input
        id="employee_id"
        type="number"
        placeholder="Enter Employee ID"
        class="border w-full p-3 rounded mb-4">

    <!-- Password -->
    <input
        id="password"
        readonly
        class="border w-full p-3 rounded mb-4">

    <!-- Generate -->
    <button
        onclick="generatePassword()"
        class="bg-indigo-600 text-white w-full p-3 rounded mb-3">
        Generate Password
    </button>

    <!-- Save -->
    <button
        onclick="savePassword()"
        class="bg-green-600 text-white w-full p-3 rounded">
        Save Password
    </button>

</div>

<script>

async function generatePassword(){

    const response = await fetch("http://localhost:5000/api/password/generate");

    const result = await response.json();

    if(result.success){
        document.getElementById("password").value =
        result.data.password;
    }

}

async function savePassword(){

    const employee_id =
    document.getElementById("employee_id").value;

    const password =
    document.getElementById("password").value;

    if(employee_id=="" || password==""){
        alert("Enter Employee ID and Generate Password");
        return;
    }

    const response = await fetch("http://localhost:5000/api/password/change",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            employee_id,
            password
        })

    });

    const result = await response.json();

    alert(result.message);

}

</script>

</body>
</html>
